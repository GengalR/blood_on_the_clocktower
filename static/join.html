<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood on the Clocktower - Beitreten</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Lora:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', 'Georgia', serif;
            background:
                linear-gradient(to bottom, rgba(15, 15, 15, 0.75), rgba(45, 27, 61, 0.65)),
                url('/static/images/blood_on_the_clocktower.webp') center/cover no-repeat fixed;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f5f5dc;
        }

        .container {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.9),
                inset 0 0 60px rgba(139, 0, 0, 0.1),
                0 0 40px rgba(139, 0, 0, 0.3);
            border: 2px solid rgba(139, 0, 0, 0.5);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent, #8b0000, #dc143c, #8b0000, transparent);
            box-shadow: 0 0 10px #8b0000;
        }

        h1 {
            font-family: 'Cinzel', 'Times New Roman', serif;
            color: #dc143c;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            text-shadow:
                0 0 20px rgba(220, 20, 60, 0.8),
                0 0 40px rgba(139, 0, 0, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .subtitle {
            text-align: center;
            color: #c0c0c0;
            margin-bottom: 30px;
            font-family: 'Crimson Text', serif;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .game-info {
            background: rgba(45, 27, 61, 0.4);
            border: 1px solid rgba(139, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .game-info p {
            margin: 8px 0;
            color: #c0c0c0;
            font-family: 'Crimson Text', serif;
            font-size: 16px;
        }

        .game-info strong {
            color: #d4af37;
            font-weight: 600;
        }

        .game-info span {
            color: #f5f5dc;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #d4af37;
            font-weight: 600;
            font-family: 'Crimson Text', serif;
            font-size: 1.1em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(139, 0, 0, 0.4);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Lora', serif;
            background: rgba(15, 15, 15, 0.6);
            color: #f5f5dc;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        input:focus {
            outline: none;
            border-color: #dc143c;
            background: rgba(15, 15, 15, 0.8);
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.7),
                0 0 15px rgba(220, 20, 60, 0.4);
        }

        input::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            color: #f5f5dc;
            border: 2px solid rgba(220, 20, 60, 0.4);
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow:
                0 6px 20px rgba(139, 0, 0, 0.6),
                0 0 30px rgba(139, 0, 0, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 30px rgba(139, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.5);
            border-color: rgba(220, 20, 60, 0.7);
            background: linear-gradient(135deg, #a00000 0%, #5a0000 100%);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #dc143c;
            margin-top: 15px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(220, 20, 60, 0.5);
        }

        .error {
            background: rgba(139, 0, 0, 0.3);
            border: 2px solid rgba(220, 20, 60, 0.6);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            box-shadow:
                0 4px 15px rgba(139, 0, 0, 0.4),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕯️ Blood on the Clocktower</h1>
        <p class="subtitle">Spiel beitreten</p>

        <div id="error" class="error" style="display: none;"></div>

        <div class="game-info" id="gameInfo">
            <p><strong>Spiel-ID:</strong> <span id="gameId">-</span></p>
            <p><strong>Edition:</strong> <span id="edition">-</span></p>
            <p><strong>Spieler:</strong> <span id="playerCount">0</span></p>
        </div>

        <form id="joinGameForm">
            <div class="form-group">
                <label for="playerName">Dein Name:</label>
                <input type="text" id="playerName" required placeholder="z.B. Anna">
            </div>

            <button type="submit" id="submitBtn">Beitreten</button>
            <div class="loading" id="loading" style="display: none;">Lade...</div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');
        const errorDiv = document.getElementById('error');
        const joinGameForm = document.getElementById('joinGameForm');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        // Zeige Fehler
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Lade Spielinfo
        async function loadGameInfo() {
            if (!gameId) {
                showError('Keine Spiel-ID in der URL gefunden!');
                submitBtn.disabled = true;
                return;
            }

            try {
                const response = await fetch(`/api/game/${gameId}`);

                if (!response.ok) {
                    throw new Error('Spiel nicht gefunden');
                }

                const game = await response.json();

                document.getElementById('gameId').textContent = game.id;
                document.getElementById('edition').textContent = game.edition;
                document.getElementById('playerCount').textContent = game.player_count;

                if (game.started) {
                    showError('Das Spiel hat bereits begonnen!');
                    submitBtn.disabled = true;
                }

            } catch (error) {
                showError('Fehler beim Laden der Spielinfo: ' + error.message);
                submitBtn.disabled = true;
            }
        }

        // Trete Spiel bei
        joinGameForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const playerName = document.getElementById('playerName').value;

            if (!playerName) {
                showError('Bitte gib deinen Namen ein!');
                return;
            }

            loading.style.display = 'block';
            submitBtn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(`/api/game/${gameId}/join`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        player_name: playerName
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Fehler beim Beitreten');
                }

                const data = await response.json();

                // Speichere Daten in localStorage
                localStorage.setItem('gameId', data.game_id);
                localStorage.setItem('playerId', data.player_id);
                localStorage.setItem('playerName', data.name);

                alert(`Erfolgreich beigetreten! 🎉\n\nWarte darauf, dass der Erzähler das Spiel startet.`);

                // Weiterleitung zur Spieler-Ansicht
                window.location.href = `/player.html?game=${data.game_id}&player=${data.player_id}`;

            } catch (error) {
                showError('Fehler: ' + error.message);
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        // Lade Spielinfo beim Start
        loadGameInfo();
    </script>
</body>
</html>
