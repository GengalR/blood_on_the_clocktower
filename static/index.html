<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood on the Clocktower - Neues Spiel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Lora:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', 'Georgia', serif;
            background:
                linear-gradient(to bottom, rgba(15, 15, 15, 0.75), rgba(45, 27, 61, 0.65)),
                url('/static/images/blood_on_the_clocktower.webp') center/cover no-repeat fixed;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f5f5dc;
        }

        .container {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.9),
                inset 0 0 60px rgba(139, 0, 0, 0.1),
                0 0 40px rgba(139, 0, 0, 0.3);
            border: 2px solid rgba(139, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent,
                #8b0000,
                #dc143c,
                #8b0000,
                transparent);
            box-shadow: 0 0 10px #8b0000;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent,
                #8b0000,
                #dc143c,
                #8b0000,
                transparent);
            box-shadow: 0 0 10px #8b0000;
        }

        h1 {
            font-family: 'Cinzel', 'Times New Roman', serif;
            color: #dc143c;
            margin-bottom: 10px;
            text-align: center;
            font-size: 3em;
            font-weight: 700;
            text-shadow:
                0 0 20px rgba(220, 20, 60, 0.8),
                0 0 40px rgba(139, 0, 0, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 2px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow:
                    0 0 20px rgba(220, 20, 60, 0.6),
                    0 0 40px rgba(139, 0, 0, 0.3),
                    2px 2px 4px rgba(0, 0, 0, 0.9);
            }
            to {
                text-shadow:
                    0 0 30px rgba(220, 20, 60, 1),
                    0 0 60px rgba(139, 0, 0, 0.7),
                    2px 2px 4px rgba(0, 0, 0, 0.9);
            }
        }

        .subtitle {
            text-align: center;
            color: #c0c0c0;
            margin-bottom: 40px;
            font-size: 1.2em;
            font-family: 'Crimson Text', serif;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .icon {
            font-size: 4em;
            text-align: center;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(220, 20, 60, 0.6));
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(220, 20, 60, 0.6));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 20px rgba(220, 20, 60, 0.9));
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #d4af37;
            font-weight: 600;
            font-family: 'Crimson Text', serif;
            font-size: 1.1em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(139, 0, 0, 0.4);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Lora', serif;
            background: rgba(15, 15, 15, 0.6);
            color: #f5f5dc;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #dc143c;
            background: rgba(15, 15, 15, 0.8);
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.7),
                0 0 15px rgba(220, 20, 60, 0.4);
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        select option {
            background: #1a1a1a;
            color: #f5f5dc;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            color: #f5f5dc;
            border: 2px solid rgba(220, 20, 60, 0.4);
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow:
                0 6px 20px rgba(139, 0, 0, 0.6),
                0 0 30px rgba(139, 0, 0, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(220, 20, 60, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 10px 30px rgba(139, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.5);
            border-color: rgba(220, 20, 60, 0.7);
            background: linear-gradient(135deg, #a00000 0%, #5a0000 100%);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #dc143c;
            font-style: italic;
            text-shadow: 0 0 10px rgba(220, 20, 60, 0.5);
        }

        .error {
            background-color: rgba(139, 0, 0, 0.3);
            border: 2px solid rgba(220, 20, 60, 0.6);
            color: #ff6b6b;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
            box-shadow:
                0 4px 15px rgba(139, 0, 0, 0.4),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .edition-info {
            background: rgba(45, 27, 61, 0.4);
            border: 1px solid rgba(139, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: #c0c0c0;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .edition-info strong {
            color: #d4af37;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }

            h1 {
                font-size: 2.2em;
            }

            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚰️</div>
        <h1>Blood on the Clocktower</h1>
        <p class="subtitle">Erstelle ein neues Spiel</p>

        <div class="error" id="error-message"></div>

        <form id="create-game-form">
            <div class="form-group">
                <label for="storyteller-name">Dein Name (Erzähler)</label>
                <input
                    type="text"
                    id="storyteller-name"
                    name="storyteller-name"
                    placeholder="Gib deinen Namen ein"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="edition">Edition auswählen</label>
                <select id="edition" name="edition" required>
                    <option value="">Lade Editionen...</option>
                </select>
                <div class="edition-info" id="edition-info" style="display: none;"></div>
            </div>

            <button type="submit" id="submit-btn">
                Spiel erstellen
            </button>
        </form>

        <div class="loading" id="loading">
            <p>Spiel wird erstellt...</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Editionen laden
        async function loadEditions() {
            try {
                const response = await fetch(`${API_BASE}/api/editions`);
                const editions = await response.json();

                const select = document.getElementById('edition');
                select.innerHTML = '<option value="">Wähle eine Edition</option>';

                editions.forEach(edition => {
                    const option = document.createElement('option');
                    option.value = edition.id;
                    option.textContent = edition.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Editionen:', error);
                showError('Fehler beim Laden der Editionen. Bitte lade die Seite neu.');
            }
        }

        // Edition Info anzeigen
        document.getElementById('edition').addEventListener('change', async function() {
            const editionId = this.value;
            const infoDiv = document.getElementById('edition-info');

            if (!editionId) {
                infoDiv.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/editions/${editionId}/characters`);
                const characters = await response.json();

                const townsfolk = characters.filter(c => c.type === 'townsfolk').length;
                const outsiders = characters.filter(c => c.type === 'outsider').length;
                const minions = characters.filter(c => c.type === 'minion').length;
                const demons = characters.filter(c => c.type === 'demon').length;

                infoDiv.innerHTML = `
                    <strong>Charaktere:</strong>
                    ${townsfolk} Dorfbewohner,
                    ${outsiders} Außenseiter,
                    ${minions} Schergen,
                    ${demons} Dämonen
                `;
                infoDiv.style.display = 'block';
            } catch (error) {
                console.error('Fehler beim Laden der Charaktere:', error);
            }
        });

        // Formular absenden
        document.getElementById('create-game-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const storytellerName = document.getElementById('storyteller-name').value.trim();
            const edition = document.getElementById('edition').value;

            if (!storytellerName || !edition) {
                showError('Bitte fülle alle Felder aus.');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');

            submitBtn.disabled = true;
            loading.style.display = 'block';
            hideError();

            try {
                const response = await fetch(`${API_BASE}/api/game/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        edition: edition,
                        storyteller_name: storytellerName
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Fehler beim Erstellen des Spiels');
                }

                const data = await response.json();

                // Zur Erzähler-Seite weiterleiten
                window.location.href = `/storyteller.html?game=${data.game_id}&storyteller=${data.storyteller_id}`;

            } catch (error) {
                console.error('Fehler:', error);
                showError(error.message || 'Fehler beim Erstellen des Spiels. Bitte versuche es erneut.');
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Editionen beim Laden der Seite laden
        loadEditions();
    </script>
</body>
</html>
