<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood on the Clocktower - Spieler</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600;700&family=Lora:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', 'Georgia', serif;
            background:
                linear-gradient(to bottom, rgba(15, 15, 15, 0.5), rgba(45, 27, 61, 0.4)),
                url('/static/images/blood_on_the_clocktower.webp') center/cover no-repeat fixed;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: #f5f5dc;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            border-radius: 20px;
            padding: 30px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.9),
                inset 0 0 40px rgba(139, 0, 0, 0.1),
                0 0 30px rgba(139, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 2px solid rgba(139, 0, 0, 0.4);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #dc143c;
            margin-bottom: 20px;
            text-align: center;
            text-shadow:
                0 0 20px rgba(220, 20, 60, 0.8),
                2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .waiting {
            text-align: center;
            padding: 40px 20px;
        }

        .waiting h2 {
            color: #dc143c;
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(220, 20, 60, 0.6);
        }

        .waiting p {
            color: #c0c0c0;
            font-size: 16px;
        }

        .role-card {
            text-align: center;
            padding: 20px;
        }

        .role-image {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 4px solid rgba(212, 175, 55, 0.5);
            box-shadow:
                0 0 30px rgba(212, 175, 55, 0.4),
                0 8px 20px rgba(0, 0, 0, 0.6);
            object-fit: cover;
            display: block;
        }

        .role-image.loading {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.2) 0%, rgba(74, 0, 0, 0.2) 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .role-name {
            font-size: 32px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .role-type {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .role-type.townsfolk {
            background: rgba(25, 118, 210, 0.3);
            color: #64b5f6;
            border: 1px solid rgba(25, 118, 210, 0.5);
        }

        .role-type.outsiders {
            background: rgba(245, 124, 0, 0.3);
            color: #ffb74d;
            border: 1px solid rgba(245, 124, 0, 0.5);
        }

        .role-type.minions {
            background: rgba(194, 24, 91, 0.3);
            color: #f06292;
            border: 1px solid rgba(194, 24, 91, 0.5);
        }

        .role-type.demons {
            background: rgba(211, 47, 47, 0.3);
            color: #e57373;
            border: 1px solid rgba(211, 47, 47, 0.5);
        }

        .role-ability {
            background: rgba(45, 27, 61, 0.3);
            border: 1px solid rgba(139, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .role-ability h3 {
            color: #d4af37;
            font-family: 'Crimson Text', serif;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .role-ability p {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 16px;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%);
            border: 2px solid rgba(220, 20, 60, 0.4);
            color: #f5f5dc;
            font-family: 'Cinzel', serif;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow:
                0 4px 15px rgba(139, 0, 0, 0.5),
                0 0 20px rgba(139, 0, 0, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .refresh-btn:hover {
            background: linear-gradient(135deg, #a00000 0%, #5a0000 100%);
            transform: translateY(-2px);
            box-shadow:
                0 6px 20px rgba(139, 0, 0, 0.7),
                0 0 30px rgba(255, 0, 0, 0.4);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation Menu Bar */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 2px solid #8b0000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 2000;
        }

        .nav-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            font-family: 'Crimson Text', serif;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.3) 0%, rgba(74, 0, 0, 0.3) 100%);
            color: #fff;
            border: 1px solid rgba(139, 0, 0, 0.5);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(139, 0, 0, 0.5);
            border-color: rgba(255, 68, 68, 0.7);
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.5) 0%, rgba(74, 0, 0, 0.5) 100%);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn.overview {
            border-color: rgba(76, 175, 80, 0.5);
            background: linear-gradient(135deg, rgba(45, 122, 45, 0.3) 0%, rgba(26, 77, 26, 0.3) 100%);
        }

        .nav-btn.overview:hover {
            border-color: rgba(76, 175, 80, 0.7);
            background: linear-gradient(135deg, rgba(45, 122, 45, 0.5) 0%, rgba(26, 77, 26, 0.5) 100%);
        }

        .nav-btn.wiki {
            border-color: rgba(68, 138, 255, 0.5);
            background: linear-gradient(135deg, rgba(26, 77, 143, 0.3) 0%, rgba(13, 38, 71, 0.3) 100%);
        }

        .nav-btn.wiki:hover {
            border-color: rgba(68, 138, 255, 0.7);
            background: linear-gradient(135deg, rgba(26, 77, 143, 0.5) 0%, rgba(13, 38, 71, 0.5) 100%);
        }

        .nav-btn.hidden {
            display: none;
        }

        /* Content Abstand zur Navigation */
        body {
            padding-top: 60px;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #8b0000;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9),
                        0 0 40px rgba(139, 0, 0, 0.3),
                        inset 0 0 60px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #8b0000;
            line-height: 1;
            width: 30px;
            height: 30px;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            transform: rotate(90deg);
        }

        .modal-content h2 {
            color: #ff4444;
            margin-bottom: 25px;
            font-size: 28px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 15px;
        }

        .rule-section {
            margin: 25px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #8b0000;
            border-radius: 6px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .rule-section:last-child {
            margin-bottom: 0;
        }

        .rule-section h3 {
            color: #ff6666;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 102, 102, 0.3);
        }

        .rule-section ul {
            list-style: none;
            padding-left: 0;
        }

        .rule-section li {
            padding: 8px 0;
            color: #d4d4d4;
            line-height: 1.8;
            border-bottom: 1px solid rgba(139, 0, 0, 0.2);
        }

        .rule-section li:last-child {
            border-bottom: none;
        }

        .rule-section li strong {
            color: #ff8888;
            font-weight: 600;
        }

        /* Overview Modal Specific Styles */
        .overview-modal .modal-content {
            max-width: 98vw;
            max-height: 98vh;
            padding: 10px;
        }

        .overview-image {
            width: 100%;
            height: auto;
            max-height: 96vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .overview-modal h2 {
            display: none;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .nav-bar {
                height: auto;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            .nav-title {
                font-size: 18px;
            }

            .nav-buttons {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .nav-btn {
                font-size: 14px;
                padding: 8px 16px;
            }

            body {
                padding-top: 120px;
            }

            .modal-content {
                padding: 20px;
                max-height: 90vh;
                margin: 10px;
                width: calc(100% - 20px);
            }

            .modal-content h2 {
                font-size: 20px;
                padding-right: 30px;
            }

            .rule-section h3 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Menu Bar -->
    <nav class="nav-bar">
        <div class="nav-title">🎭 Blood on the Clocktower</div>
        <div class="nav-buttons">
            <button id="overviewBtn" class="nav-btn overview hidden" aria-label="Editions-Überblick anzeigen">
                🗺️ Überblick
            </button>
            <a id="wikiBtn" class="nav-btn wiki hidden" target="_blank" rel="noopener noreferrer"
               aria-label="Charakter-Wiki öffnen">
                📚 Wiki
            </a>
            <button id="quickRulesBtn" class="nav-btn" aria-label="Schnellregeln anzeigen">
                📜 Regeln
            </button>
        </div>
    </nav>

    <!-- Quick Rules Modal -->
    <div id="rulesModal" class="modal-overlay" role="dialog"
         aria-modal="true" aria-labelledby="rulesModalTitle">
        <div class="modal-content">
            <button class="modal-close" aria-label="Schließen">×</button>
            <h2 id="rulesModalTitle">Lädt...</h2>
            <div id="rulesContent">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Overview Modal -->
    <div id="overviewModal" class="modal-overlay overview-modal" role="dialog"
         aria-modal="true" aria-labelledby="overviewModalTitle">
        <div class="modal-content">
            <button class="modal-close" aria-label="Schließen">×</button>
            <h2 id="overviewModalTitle">Editions-Überblick</h2>
            <div id="overviewContent">
                <img id="overviewImage" class="overview-image" src="" alt="Editions-Überblick">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h1>🎭 Blood on the Clocktower</h1>

            <div id="waitingView" class="waiting">
                <div class="spinner"></div>
                <h2>Warte auf Spielstart...</h2>
                <p>Der Erzähler wird bald das Spiel starten und die Rollen verteilen.</p>
                <button class="refresh-btn" onclick="checkRole()">Aktualisieren</button>
            </div>

            <div id="roleView" style="display: none;">
                <div class="role-card">
                    <img id="roleImage" class="role-image loading" src="" alt="Charakter" style="display: none;">
                    <div class="role-name" id="roleName">-</div>
                    <span class="role-type" id="roleType">-</span>

                    <div class="role-ability">
                        <h3>📜 Deine Fähigkeit:</h3>
                        <p id="roleAbility">-</p>
                    </div>
                </div>

                <button class="refresh-btn" onclick="checkRole()">Aktualisieren</button>
            </div>
        </div>
    </div>

    <script>
        // Quick Rules Modal Funktionen
        let rulesLoaded = false;

        async function loadQuickRules() {
            if (rulesLoaded) return; // Nur einmal laden

            try {
                const response = await fetch('/api/quick-rules');
                if (!response.ok) {
                    throw new Error('Fehler beim Laden der Regeln');
                }

                const data = await response.json();

                // Titel setzen
                document.getElementById('rulesModalTitle').textContent = data.title;

                // Content erstellen
                const rulesContent = document.getElementById('rulesContent');
                rulesContent.innerHTML = '';

                data.sections.forEach(section => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'rule-section';

                    const heading = document.createElement('h3');
                    heading.textContent = section.title; // Emoji entfernt
                    sectionDiv.appendChild(heading);

                    const ul = document.createElement('ul');
                    section.rules.forEach(rule => {
                        const li = document.createElement('li');
                        li.innerHTML = rule;
                        ul.appendChild(li);
                    });
                    sectionDiv.appendChild(ul);

                    rulesContent.appendChild(sectionDiv);
                });

                rulesLoaded = true;
            } catch (error) {
                console.error('Fehler beim Laden der Regeln:', error);
                document.getElementById('rulesModalTitle').textContent = 'Fehler';
                document.getElementById('rulesContent').innerHTML =
                    '<p style="color: #d32f2f;">Regeln konnten nicht geladen werden.</p>';
            }
        }

        async function openRulesModal() {
            const modal = document.getElementById('rulesModal');
            modal.classList.add('active');

            // Regeln beim ersten Öffnen laden
            await loadQuickRules();

            // Focus auf Close-Button für Accessibility
            const closeBtn = modal.querySelector('.modal-close');
            closeBtn.focus();
        }

        function closeRulesModal() {
            const modal = document.getElementById('rulesModal');
            modal.classList.remove('active');
            // Focus zurück auf Button
            document.getElementById('quickRulesBtn').focus();
        }

        // Event Listeners für Quick Rules Modal
        document.getElementById('quickRulesBtn').addEventListener('click', openRulesModal);

        document.querySelector('.modal-close').addEventListener('click', closeRulesModal);

        // Click außerhalb Modal schließt
        document.getElementById('rulesModal').addEventListener('click', (e) => {
            if (e.target.id === 'rulesModal') {
                closeRulesModal();
            }
        });

        // Overview Modal Functions
        function openOverviewModal() {
            const modal = document.getElementById('overviewModal');
            modal.classList.add('active');

            // Focus auf Close-Button für Accessibility
            const closeBtn = modal.querySelectorAll('.modal-close')[1];
            if (closeBtn) closeBtn.focus();
        }

        function closeOverviewModal() {
            const modal = document.getElementById('overviewModal');
            modal.classList.remove('active');
            // Focus zurück auf Button
            document.getElementById('overviewBtn').focus();
        }

        // Event Listeners für Overview Modal
        document.getElementById('overviewBtn').addEventListener('click', openOverviewModal);

        // Close-Button im Overview Modal
        const overviewModalCloseBtn = document.getElementById('overviewModal').querySelector('.modal-close');
        if (overviewModalCloseBtn) {
            overviewModalCloseBtn.addEventListener('click', closeOverviewModal);
        }

        // Click außerhalb Modal schließt
        document.getElementById('overviewModal').addEventListener('click', (e) => {
            if (e.target.id === 'overviewModal') {
                closeOverviewModal();
            }
        });

        // ESC-Taste schließt Modals (Fixed: 2025-12-20)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const rulesModal = document.getElementById('rulesModal');
                const overviewModal = document.getElementById('overviewModal');

                if (rulesModal.classList.contains('active')) {
                    closeRulesModal();
                }
                if (overviewModal.classList.contains('active')) {
                    closeOverviewModal();
                }
            }
        });

        // Bestehende Player-Logik
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game');
        const playerId = urlParams.get('player');

        const waitingView = document.getElementById('waitingView');
        const roleView = document.getElementById('roleView');

        // Prüfe ob Rolle bereits zugewiesen
        async function checkRole() {
            if (!gameId || !playerId) {
                alert('Fehler: Fehlende Parameter in URL!');
                return;
            }

            try {
                const response = await fetch(`/api/player/${gameId}/${playerId}/role`);

                if (response.ok) {
                    const role = await response.json();
                    showRole(role);
                } else {
                    // Noch keine Rolle zugewiesen
                    showWaiting();
                }
            } catch (error) {
                console.error('Fehler:', error);
            }
        }

        function showWaiting() {
            waitingView.style.display = 'block';
            roleView.style.display = 'none';
        }

        function showRole(role) {
            document.getElementById('roleName').textContent = role.name;
            document.getElementById('roleType').textContent = getTypeLabel(role.type);
            document.getElementById('roleType').className = `role-type ${role.type}`;
            document.getElementById('roleAbility').textContent = role.ability;

            // Charakterbild laden und anzeigen
            try {
                const roleImage = document.getElementById('roleImage');
                if (roleImage && role.id && role.edition) {
                    // Edition-Name für Pfad formatieren (z.B. "TroubleBrewing" -> "trouble_brewing")
                    const editionPath = role.edition
                        .replace(/([A-Z])/g, '_$1')  // Großbuchstaben mit Unterstrich prefixen
                        .toLowerCase()                 // Alles klein schreiben
                        .replace(/^_/, '');           // Führenden Unterstrich entfernen

                    const imagePath = `/static/images/${editionPath}/characters/${role.id}.png`;

                    // Bild-Element vorbereiten
                    roleImage.src = imagePath;
                    roleImage.alt = role.name;
                    roleImage.classList.add('loading');
                    roleImage.style.display = 'block';

                    // Loading-Animation entfernen wenn Bild geladen
                    roleImage.onload = () => {
                        roleImage.classList.remove('loading');
                    };

                    // Bei Fehler: Bild verstecken
                    roleImage.onerror = () => {
                        console.warn(`Charakterbild nicht gefunden: ${imagePath}`);
                        roleImage.style.display = 'none';
                    };
                }
            } catch (error) {
                console.error('Fehler beim Laden des Charakterbilds:', error);
            }

            // Wiki-Button konfigurieren und anzeigen
            try {
                const wikiBtn = document.getElementById('wikiBtn');
                if (wikiBtn) {
                    const characterName = role.name.replace(/\s+/g, '_');
                    wikiBtn.href = `https://wiki.bloodontheclocktower.com/${characterName}`;
                    wikiBtn.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Fehler beim Konfigurieren des Wiki-Buttons:', error);
            }

            // Überblick-Button konfigurieren und anzeigen
            try {
                if (role.edition) {
                    const overviewBtn = document.getElementById('overviewBtn');
                    const overviewImage = document.getElementById('overviewImage');

                    if (overviewBtn && overviewImage) {
                        // Edition-Name für Pfad formatieren (z.B. "TroubleBrewing" -> "trouble_brewing")
                        const editionPath = role.edition
                            .replace(/([A-Z])/g, '_$1')  // Großbuchstaben mit Unterstrich prefixen
                            .toLowerCase()                 // Alles klein schreiben
                            .replace(/^_/, '');           // Führenden Unterstrich entfernen

                        overviewImage.src = `/static/images/${editionPath}/overview.png`;
                        overviewImage.alt = `Überblick für ${role.edition}`;
                        overviewBtn.classList.remove('hidden');
                    }
                }
            } catch (error) {
                console.error('Fehler beim Konfigurieren des Überblick-Buttons:', error);
            }

            waitingView.style.display = 'none';
            roleView.style.display = 'block';

            // Verstecke den Aktualisieren-Button im roleView, da das Spiel gestartet ist
            const roleViewRefreshBtn = roleView.querySelector('.refresh-btn');
            if (roleViewRefreshBtn) {
                roleViewRefreshBtn.style.display = 'none';
            }
        }

        function getTypeLabel(type) {
            const labels = {
                'townsfolk': '👥 Townsfolk',
                'outsiders': '🎭 Outsider',
                'minions': '😈 Minion',
                'demons': '👹 Dämon'
            };
            return labels[type] || type;
        }

        // Auto-Refresh alle 5 Sekunden
        setInterval(checkRole, 5000);

        // Initiale Prüfung
        checkRole();
    </script>
</body>
</html>
